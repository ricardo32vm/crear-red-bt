<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="4" fill="#1a1a2e"/>
  <!-- Cuerpo del medidor (caja) -->
  <rect x="6" y="7" width="20" height="18" rx="2" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <!-- Pantalla / display -->
  <rect x="9" y="10" width="14" height="6" rx="1" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1"/>
  <!-- Dígitos simulados -->
  <line x1="11" y1="12" x2="11" y2="15" stroke="#00e5ff" stroke-width="1.2"/>
  <line x1="14" y1="12" x2="14" y2="15" stroke="#00e5ff" stroke-width="1.2"/>
  <line x1="17" y1="12" x2="17" y2="15" stroke="#00e5ff" stroke-width="1.2"/>
  <line x1="20" y1="12" x2="20" y2="15" stroke="#00e5ff" stroke-width="1.2"/>
  <!-- Disco giratorio -->
  <ellipse cx="16" cy="21" rx="4" ry="2" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  <line x1="16" y1="19" x2="17" y2="23" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Terminales -->
  <line x1="10" y1="25" x2="10" y2="28" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="25" x2="16" y2="28" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="25" x2="22" y2="28" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
</svg>
