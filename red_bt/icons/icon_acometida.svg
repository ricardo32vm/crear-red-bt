<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="4" fill="#1a1a2e"/>
  <!-- Poste / nodo origen -->
  <line x1="5" y1="4" x2="5" y2="20" stroke="#ff8c00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="8"  x2="8" y2="8"  stroke="#ff8c00" stroke-width="2" stroke-linecap="round"/>
  <!-- Cable acometida (diagonal hacia medidor) -->
  <line x1="5" y1="8" x2="26" y2="22" stroke="#ff8c00" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,2"/>
  <!-- Medidor destino -->
  <rect x="22" y="19" width="8" height="9" rx="1.5" fill="none" stroke="#ff8c00" stroke-width="2"/>
  <line x1="24" y1="21" x2="28" y2="21" stroke="#ff8c00" stroke-width="1.2"/>
  <line x1="24" y1="23" x2="28" y2="23" stroke="#ff8c00" stroke-width="1.2"/>
</svg>
